{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div><div class="breadcrumb"><a href="{{url_for('activities')}}">Activities</a> / Scheduled activity</div><h1>Update scheduled activity</h1><p class="text-muted">{{scheduled.title}} · {{scheduled.entity_name}}</p></div></div>
<form method="post" enctype="multipart/form-data" class="card form-card"><div class="card-body row g-3">
<div class="col-md-6"><label class="form-label">Account</label><input class="form-control" value="{{scheduled.entity_name}}" disabled></div><div class="col-md-3"><label class="form-label">Activity type</label><input class="form-control" value="{{scheduled.task_type.replace('Scheduled ','')}}" disabled></div><div class="col-md-3"><label class="form-label">Assigned to</label><input class="form-control" value="{{scheduled.assignee_name}}" disabled></div>
<div class="col-md-6"><label class="form-label">Scheduled date</label><input class="form-control" value="{{scheduled.due_at.strftime('%d %b %Y')}}{% if scheduled.due_at.strftime('%H:%M') != '00:00' %} · {{scheduled.due_at.strftime('%I:%M %p')}}{% endif %}" disabled></div><div class="col-md-3"><label class="form-label">Repeat</label><input class="form-control" value="{{scheduled.recurrence_type or 'One time'}}{% if scheduled.recurrence_value %} · {{scheduled.recurrence_value}}{% endif %}" disabled></div><div class="col-md-3"><label class="form-label">Priority</label><input class="form-control" value="{{scheduled.priority}}" disabled></div>
<div class="col-12"><label class="form-label">Scheduled instructions</label><textarea class="form-control" disabled>{{scheduled.details or 'No additional instructions.'}}</textarea></div>
<div class="col-md-6"><label class="form-label required">Actual activity date</label><input name="activity_date" type="date" class="form-control" required value="{{today_iso}}"></div><div class="col-md-6"><label class="form-label">Actual time</label><input name="activity_time" type="time" class="form-control"></div><div class="col-12"><label class="form-label required">Outcome / completion notes</label><textarea name="notes" class="form-control" required></textarea></div><div class="col-12"><label class="form-label">Attach files or photos</label><input name="attachments" type="file" multiple class="form-control" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"><input name="file_caption" class="form-control mt-2" placeholder="Optional file caption"></div>
</div><div class="card-footer text-end"><button class="btn btn-primary">Save completed activity</button></div></form>
{% endblock %}
