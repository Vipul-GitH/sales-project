{% macro status(value) %}<span class="status status-{{ value|lower|replace(' ','-') }}">{{ value }}</span>{% endmacro %}
{% macro filters(statuses=[], types=[]) %}<form class="filter-bar" method="get"><div class="filter-scroll"><label class="visually-hidden" for="filterQuery">Search</label><input id="filterQuery" name="q" placeholder="Search" value="{{filters.q}}"><label class="visually-hidden" for="filterOwner">Owner</label><select id="filterOwner" name="owner"><option value="">All owners</option>{% for u in users if u.active %}<option {% if filters.owner==u.name %}selected{% endif %}>{{u.name}}</option>{% endfor %}</select><label class="visually-hidden" for="filterStatus">Status</label><select id="filterStatus" name="status"><option value="">All statuses</option>{% for s in statuses %}<option {% if filters.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select>{% if types %}<label class="visually-hidden" for="filterType">Type</label><select id="filterType" name="type"><option value="">All types</option>{% for t in types %}<option {% if filters.type==t %}selected{% endif %}>{{t}}</option>{% endfor %}</select>{% endif %}</div><div class="d-flex gap-2"><a class="btn btn-light btn-sm" href="{{request.path}}">Clear filters</a><button class="btn btn-primary btn-sm">Apply filters</button></div></form>{% endmacro %}
