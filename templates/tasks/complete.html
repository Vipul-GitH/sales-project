{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="breadcrumb"><a href="{{url_for('my_tasks')}}">Tasks</a> / Complete</div><h1>Complete task</h1><p class="text-muted">{{task.title}}{% if task.account %} · {{task.account}}{% endif %}</p></div></div><form method="post" class="card form-card"><input type="hidden" name="next" value="{{request.args.get('next','')}}"><div class="card-body"><label class="form-label required" for="completionNotes">Completion notes</label><textarea id="completionNotes" name="completion_notes" class="form-control" required placeholder="What was completed and what was the outcome?"></textarea></div><div class="card-footer text-end"><button class="btn btn-primary">Mark completed</button></div></form>{% endblock %}
