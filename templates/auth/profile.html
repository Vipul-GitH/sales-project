{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div><div class="breadcrumb">Settings / Profile</div><h1>My profile</h1></div></div>
<div class="card form-card"><div class="card-body">
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label required" for="profileName">Name</label><input id="profileName" name="full_name" class="form-control" value="{{ profile_user.name }}" required></div>
    <div class="col-md-6"><label class="form-label" for="profileMobile">Mobile</label><input id="profileMobile" name="mobile" class="form-control" value="{{ profile_user.contact or '' }}"></div>
    <div class="col-12"><small class="text-muted">Login password is your DOB without slashes (DDMMYYYY).</small></div>
    <div class="col-12"><button class="btn btn-primary">Save changes</button></div>
  </form>
</div></div>
{% endblock %}
